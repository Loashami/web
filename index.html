<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vet Clinic Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="flex h-screen bg-gray-100">

  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r flex flex-col">
    <!-- Logo -->
    <div class="h-16 flex items-center justify-center border-b px-4">
      <a href="#" class="text-xl font-bold text-gray-800">Vet Clinic</a>
    </div>

    <!-- Navigation -->
    <nav id="sidebar-links" class="flex-1 overflow-y-auto px-2 py-4 space-y-1">
      <!-- JS insertará los enlaces aquí -->
    </nav>

    <!-- Footer -->
    <div class="p-4 border-t">
      <a href="/" class="flex items-center justify-start px-3 py-2 border rounded text-sm text-gray-600 hover:bg-gray-100">
        <i data-lucide="log-out" class="mr-2 w-4 h-4"></i> Log Out
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <main id="main-content" class="flex-1 p-6 overflow-y-auto">
    <!-- Aquí se cargará dinámicamente el contenido -->
  </main>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="java.js"></script>
</body>
</html>
