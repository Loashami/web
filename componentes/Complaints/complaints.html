<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Quejas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fade-in { animation: fade-in 0.2s ease-out forwards; }

    .toast {
      animation: fade-in 0.3s ease-out, fade-out 0.3s ease-in 2.5s forwards;
    }
    @keyframes fade-out {
      to { opacity: 0; transform: translateY(-10px); }
    }

    body.modal-open { overflow: hidden; }
  </style>
</head>
<body class="bg-gray-100">
  <div class="flex min-h-screen">
    <main class="flex-1 p-6">
      <h1 class="mb-6 text-3xl font-bold text-gray-800">Gestión de Quejas</h1>

      <div class="flex flex-col sm:flex-row sm:items-center sm:gap-4 mb-6 gap-2">
        <select id="statusFilter" class="border rounded-md p-2 w-full sm:w-44 bg-white">
          <option value="todas">Todos los estados</option>
          <option value="pendiente">Pendiente</option>
          <option value="resuelta">Resuelta</option>
        </select>

        <input id="searchInput" type="text" placeholder="Buscar quejas..." class="border rounded-md p-2 w-full flex-1">
      </div>

      <div class="overflow-x-auto border rounded-md bg-white">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-100 text-gray-700 text-sm uppercase tracking-wider">
            <tr>
              <th class="p-3 text-left">Fecha</th>
              <th class="p-3 text-left">Cliente</th>
              <th class="p-3 text-left">Correo</th>
              <th class="p-3 text-left">Celular</th>
              <th class="p-3 text-left">Asunto</th>
              <th class="p-3 text-left">Estado</th>
              <th class="p-3 text-left">Veterinario</th>
              <th class="p-3 text-left">Acciones</th>
            </tr>
          </thead>
          <tbody id="complaintsBody" class="bg-white divide-y divide-gray-200"></tbody>
        </table>
      </div>

      <p id="resultCount" class="text-sm text-gray-600 mt-4"></p>
    </main>
  </div>

  <!-- Modal -->
  <div id="complaintModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div id="modalBox" class="bg-white rounded-lg shadow-lg p-6 w-full max-w-xl max-h-[80vh] overflow-y-auto animate-fade-in">
      <h2 class="text-xl font-bold mb-2 text-gray-800">Detalles de la Queja</h2>
      <div id="modalContent" class="space-y-2 text-sm text-gray-700"></div>
      <div id="modalActions" class="flex justify-end gap-2 mt-4 hidden">
        <button onclick="closeModal()" class="px-4 py-2 border rounded hover:bg-gray-100">Cancelar</button>
        <button onclick="markAsResolved()" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Marcar como resuelta</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toastContainer" class="fixed top-6 right-6 space-y-2 z-[1000]"></div>

  <!-- Script -->
  <script src="complaints.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initComplaints();
    });
  </script>
</body>
</html>
