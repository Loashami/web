
<body class="bg-gray-100">
  <div class="flex min-h-screen">
    <main class="flex-1 p-6">
      <h1 class="mb-6 text-3xl font-bold">Complaints Management</h1>

      <div class="flex flex-wrap gap-4 mb-6">
        <select id="statusFilter" class="border rounded p-2 w-40">
          <option value="all">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="in-progress">In Progress</option>
          <option value="resolved">Resolved</option>
        </select>

        <select id="priorityFilter" class="border rounded p-2 w-40">
          <option value="all">All Priorities</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>
        </select>

        <input id="searchInput" type="text" placeholder="Search complaints..." class="border rounded p-2 flex-1">
      </div>

      <div class="overflow-x-auto border rounded-md">
        <table class="min-w-full text-sm text-left">
          <thead class="bg-gray-200">
            <tr>
              <th class="p-3">Date</th>
              <th class="p-3">Client</th>
              <th class="p-3">Subject</th>
              <th class="p-3">Priority</th>
              <th class="p-3">Status</th>
              <th class="p-3">Assigned To</th>
              <th class="p-3">Actions</th>
            </tr>
          </thead>
          <tbody id="complaintsBody" class="bg-white"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="complaintModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 w-full max-w-xl max-h-[80vh] overflow-y-auto">
      <h2 class="text-xl font-bold mb-2">Complaint Details</h2>
      <div id="modalContent" class="space-y-2"></div>
      <textarea placeholder="Enter your response..." class="w-full mt-4 p-2 border rounded"></textarea>
      <div class="flex justify-end gap-2 mt-4">
        <button onclick="closeModal()" class="px-4 py-2 border rounded hover:bg-gray-100">Cancel</button>
        <button class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">Resolve & Send Response</button>
      </div>
    </div>
  </div>
  <script src="complaints.js"></script>
</body>
</html>
