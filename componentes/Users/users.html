<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-md p-6">
      <h2 class="text-2xl font-bold mb-6">Admin Panel</h2>
      <nav class="space-y-4">
        <a href="#" class="block text-blue-600 font-semibold">Dashboard</a>
        <a href="#" class="block text-blue-600 font-semibold bg-blue-100 px-2 py-1 rounded">Users</a>
        <a href="#" class="block text-blue-600 font-semibold">Settings</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6">
      <div class="container mx-auto">
        <div class="flex justify-between items-center mb-6">
          <h1 class="text-3xl font-bold">Users Management</h1>
          <button class="bg-blue-600 text-white px-4 py-2 rounded flex items-center gap-2">
            <span>+ Add new User</span>
          </button>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
          <div class="flex gap-2 flex-wrap">
            <button onclick="setTab('all')" class="tab-btn px-3 py-1 rounded bg-blue-100 text-blue-600">All Users</button>
            <button onclick="setTab('veterinarian')" class="tab-btn px-3 py-1 rounded">Veterinarians</button>
            <button onclick="setTab('client')" class="tab-btn px-3 py-1 rounded">Clients</button>
            <button onclick="setTab('intern')" class="tab-btn px-3 py-1 rounded">Interns</button>
            <button onclick="setTab('administrator')" class="tab-btn px-3 py-1 rounded">Administrators</button>
          </div>
          <div class="relative">
            <input id="searchInput" type="text" placeholder="Search users..." class="pl-8 pr-4 py-2 border rounded w-64">
            <svg class="absolute left-2 top-2.5 h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-4.35-4.35M16.65 16.65A7.5 7.5 0 1 0 3 10.5a7.5 7.5 0 0 0 13.65 6.15z"/></svg>
          </div>
        </div>

        <div class="bg-white rounded shadow overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-200">
              <tr>
                <th class="p-3 text-left">Name</th>
                <th class="p-3 text-left">Email</th>
                <th class="p-3 text-left">Role</th>
                <th class="p-3 text-left">Details</th>
                <th class="p-3 text-left">Status</th>
                <th class="p-3 text-left">Last Active</th>
                <th class="p-3 text-left">Actions</th>
              </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="users.js"></script>
</body>
</html>
