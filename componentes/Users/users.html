<body>
  <div>
  <h2 class="text-2xl font-bold mb-4">User Management</h2>

  <div class="flex gap-2 mb-4">
    <button class="tab-btn px-3 py-1 border rounded text-sm" data-tab="all">All</button>
    <button class="tab-btn px-3 py-1 border rounded text-sm" data-tab="veterinarian">Veterinarians</button>
    <button class="tab-btn px-3 py-1 border rounded text-sm" data-tab="client">Clients</button>
    <button class="tab-btn px-3 py-1 border rounded text-sm" data-tab="intern">Interns</button>
    <button class="tab-btn px-3 py-1 border rounded text-sm" data-tab="administrator">Administrators</button>
  </div>

  <input id="searchInput" type="text" placeholder="Search by name or email..." class="mb-4 p-2 border rounded w-full" />

  <div class="overflow-x-auto bg-white shadow rounded">
    <table class="min-w-full text-sm">
      <thead>
        <tr class="bg-gray-200 text-left">
          <th class="p-3">Name</th>
          <th class="p-3">Email</th>
          <th class="p-3">Role</th>
          <th class="p-3">Details</th>
          <th class="p-3">Status</th>
          <th class="p-3">Last Active</th>
          <th class="p-3">Actions</th>
        </tr>
      </thead>
      <tbody id="usersTableBody"></tbody>
    </table>
  </div>
</div>
<script src="users.js"></script>
</body>
