<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="dashboard.css">
  <title>Admin Dashboard</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-64 bg-white shadow-md p-4">
    <h2 class="text-2xl font-bold mb-4">Admin Panel</h2>
    <ul class="space-y-2">
      <li><a href="#" class="text-gray-700 hover:text-blue-600">Dashboard</a></li>
      <li><a href="#" class="text-gray-700 hover:text-blue-600">Users</a></li>
      <li><a href="#" class="text-gray-700 hover:text-blue-600">Settings</a></li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-6">
    <div class="container mx-auto">
      <h1 class="text-3xl font-bold mb-8">Administrator Dashboard</h1>

      <!-- Summary Cards -->
      <div class="grid gap-6 md:grid-cols-3">
        <div class="bg-white shadow-md rounded-xl p-4">
          <div class="flex items-center mb-2">
            <i data-lucide="calendar" class="text-blue-500 w-10 h-10"></i>
            <div class="ml-4">
              <p class="text-3xl font-bold" id="appointments-today">--</p>
              <p class="text-sm text-gray-500">Appointments today</p>
            </div>
          </div>
        </div>

        <div class="bg-white shadow-md rounded-xl p-4">
          <div class="flex items-center mb-2">
            <i data-lucide="dollar-sign" class="text-green-500 w-10 h-10"></i>
            <div class="ml-4">
              <p class="text-3xl font-bold" id="revenue-week">$--</p>
              <p class="text-sm text-gray-500">This week</p>
            </div>
          </div>
        </div>

        <div class="bg-white shadow-md rounded-xl p-4">
          <div class="flex items-center mb-2">
            <i data-lucide="x-circle" class="text-red-500 w-10 h-10"></i>
            <div class="ml-4">
              <p class="text-3xl font-bold" id="cancellations">--</p>
              <p class="text-sm text-gray-500">This week</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Chart and Alerts -->
      <div class="grid gap-6 md:grid-cols-3 mt-8">
        <!-- Chart -->
        <div class="md:col-span-2 bg-white shadow-md rounded-xl p-4">
          <h2 class="text-lg font-bold mb-2">Monthly Revenue</h2>
          <canvas id="revenueChart" height="100"></canvas>
        </div>

        <!-- Alerts -->
        <div class="bg-white shadow-md rounded-xl p-4">
          <h2 class="text-lg font-bold mb-4">Recent Alerts</h2>
          <div class="space-y-4" id="alert-container">
            <!-- Alert cards se llenan por JS -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
