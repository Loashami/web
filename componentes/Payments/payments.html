<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payments Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    .badge {
      @apply px-2 py-1 rounded text-white text-xs font-semibold;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div class="flex min-h-screen">
    <main class="flex-1 p-6">
      <div class="container mx-auto">
        <h1 class="mb-8 text-3xl font-bold">Payments Management</h1>

        <!-- Filters -->
        <div class="mb-6 flex flex-wrap items-center gap-4">
          <input type="month" id="filter-date" class="border p-2 rounded" />

          <select id="status-filter" class="border p-2 rounded w-[180px]">
            <option value="all">All Statuses</option>
            <option value="completed">Completed</option>
            <option value="pending">Pending</option>
            <option value="refunded">Refunded</option>
          </select>

          <select id="method-filter" class="border p-2 rounded w-[180px]">
            <option value="all">All Methods</option>
            <option value="credit_card">Credit Card</option>
            <option value="paypal">PayPal</option>
            <option value="cash">Cash</option>
          </select>

          <div class="relative flex-1 md:max-w-xs">
            <input type="text" id="search-query" placeholder="Search payments..." class="pl-8 border p-2 rounded w-full" />
            <span class="material-icons absolute left-2 top-2 text-gray-400">search</span>
          </div>
        </div>

        <!-- Summary -->
        <div class="mb-6 p-4 bg-white rounded shadow">
          <div class="flex items-center">
            <span class="material-icons text-green-500 text-4xl">attach_money</span>
            <div class="ml-4">
              <p class="text-3xl font-bold" id="total-amount">$0.00</p>
              <p class="text-sm text-gray-500" id="summary-date"></p>
            </div>
          </div>
        </div>

        <!-- Table -->
        <div class="bg-white rounded shadow">
          <div class="p-4 border-b">
            <h2 class="text-xl font-semibold">Payments List</h2>
          </div>
          <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
              <thead class="bg-gray-50">
                <tr>
                  <th class="p-2 text-left">Date</th>
                  <th class="p-2 text-left">Client</th>
                  <th class="p-2 text-left">Service</th>
                  <th class="p-2 text-left">Amount</th>
                  <th class="p-2 text-left">Method</th>
                  <th class="p-2 text-left">Status</th>
                  <th class="p-2 text-left">Reference</th>
                  <th class="p-2 text-left">Actions</th>
                </tr>
              </thead>
              <tbody id="payments-table"></tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>
<script src="payments.js"></script>
</body>
</html>
