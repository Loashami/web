
<body class="bg-gray-100 min-h-screen">
  <div class="flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-white p-4 shadow-md">
      <h2 class="text-xl font-bold mb-4">Admin</h2>
      <nav><ul><li class="mb-2 font-semibold">Reports</li></ul></nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6">
      <div class="container mx-auto">
        <div class="flex flex-wrap items-center justify-between mb-8 gap-4">
          <h1 class="text-3xl font-bold">Reports</h1>
          <div class="flex items-center gap-2">
            <select id="reportType" class="border rounded p-2 w-[180px]">
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly" selected>Monthly</option>
              <option value="quarterly">Quarterly</option>
              <option value="yearly">Yearly</option>
            </select>
            <input type="month" id="reportDate" class="border rounded p-2 w-[240px]" value="">
            <button id="printBtn" class="border rounded p-2 flex items-center gap-2">
              🖨️ Print
            </button>
            <button id="exportBtn" class="border rounded p-2 flex items-center gap-2">
              ⬇️ Export
            </button>
          </div>
        </div>

        <!-- Stats Cards -->
        <div class="grid gap-6 md:grid-cols-4">
          <div class="bg-white p-4 rounded shadow">
            <h3 class="font-semibold">Total Revenue</h3>
            <p id="revenueValue" class="text-2xl font-bold">$0</p>
          </div>
          <div class="bg-white p-4 rounded shadow">
            <h3 class="font-semibold">Total Appointments</h3>
            <p id="appsValue" class="text-2xl font-bold">0</p>
          </div>
          <div class="bg-white p-4 rounded shadow">
            <h3 class="font-semibold">New Clients</h3>
            <p id="clientsValue" class="text-2xl font-bold">0</p>
          </div>
          <div class="bg-white p-4 rounded shadow">
            <h3 class="font-semibold">Cancellations</h3>
            <p id="cancelsValue" class="text-2xl font-bold">0</p>
          </div>
        </div>

        <!-- Tabs -->
        <div class="mt-6">
          <div class="flex gap-4 mb-4">
            <button class="tabBtn px-4 py-2 border" data-tab="revenue">Revenue</button>
            <button class="tabBtn px-4 py-2 border" data-tab="appointments">Appointments</button>
            <button class="tabBtn px-4 py-2 border" data-tab="services">Services</button>
            <button class="tabBtn px-4 py-2 border" data-tab="staff">Staff</button>
          </div>

          <div id="revenue" class="tabContent space-y-4">🔹 Revenue Chart Placeholder</div>
          <div id="appointments" class="tabContent hidden">🔹 Appointments Chart Placeholder</div>
          <div id="services" class="tabContent hidden">🔹 Services Chart Placeholder</div>
          <div id="staff" class="tabContent hidden">🔹 Staff Performance Placeholder</div>
        </div>

        <!-- Recent Reports -->
        <div class="mt-6">
          <h2 class="text-xl font-semibold mb-4">Recent Reports</h2>
          <div id="recentReports" class="space-y-3"></div>
        </div>
      </div>
    </main>
  </div>
<script src="reports.js"></script>

</body>
</html>
