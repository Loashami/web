<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Reports Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">
  <div class="flex min-h-screen">
    <main class="flex-1 p-6">
      <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="mb-8 flex flex-wrap items-center justify-between gap-4">
          <h1 class="text-3xl font-bold">Reports</h1>
          <div class="flex items-center gap-2">
            <select class="border rounded px-3 py-2">
              <option>Daily</option>
              <option>Weekly</option>
              <option selected>Monthly</option>
              <option>Quarterly</option>
              <option>Yearly</option>
            </select>
            <input type="month" class="border rounded px-3 py-2" />
            <button class="border rounded px-3 py-2" onclick="window.print()">Print</button>
            <button class="border rounded px-3 py-2" onclick="alert('Export functionality coming soon')">Export</button>
          </div>
        </div>

        <!-- Cards -->
        <div class="grid gap-6 md:grid-cols-4">
          <div class="bg-white p-4 rounded shadow">
            <h3 class="text-lg font-semibold">Total Revenue</h3>
            <p class="text-gray-500">June 2025</p>
            <div class="text-3xl font-bold mt-2">$24,560</div>
            <p class="text-sm text-green-600">↑ 12% from last month</p>
          </div>
          <div class="bg-white p-4 rounded shadow">
            <h3 class="text-lg font-semibold">Appointments</h3>
            <p class="text-gray-500">June 2025</p>
            <div class="text-3xl font-bold mt-2">182</div>
            <p class="text-sm text-green-600">↑ 8% from last month</p>
          </div>
          <div class="bg-white p-4 rounded shadow">
            <h3 class="text-lg font-semibold">New Clients</h3>
            <p class="text-gray-500">June 2025</p>
            <div class="text-3xl font-bold mt-2">28</div>
            <p class="text-sm text-green-600">↑ 15% from last month</p>
          </div>
          <div class="bg-white p-4 rounded shadow">
            <h3 class="text-lg font-semibold">Cancellations</h3>
            <p class="text-gray-500">June 2025</p>
            <div class="text-3xl font-bold mt-2">12</div>
            <p class="text-sm text-red-600">↑ 4% from last month</p>
          </div>
        </div>

        <!-- Chart Tabs -->
        <div class="mt-10 bg-white p-4 rounded shadow">
          <div class="flex space-x-4">
            <button class="tab-btn text-blue-600 font-medium" data-tab="revenue">Revenue</button>
            <button class="tab-btn text-gray-600 hover:text-blue-600" data-tab="appointments">Appointments</button>
            <button class="tab-btn text-gray-600 hover:text-blue-600" data-tab="services">Services</button>
            <button class="tab-btn text-gray-600 hover:text-blue-600" data-tab="staff">Staff</button>
          </div>
        </div>

        <!-- Charts -->
        <div id="tab-revenue" class="tab-section block">
          <div class="mt-8 bg-white p-6 rounded shadow">
            <h3 class="text-xl font-bold mb-2">Revenue Overview</h3>
            <canvas id="revenueChart" class="h-80 w-full"></canvas>
          </div>
        </div>

        <div id="tab-appointments" class="tab-section hidden">
          <div class="mt-8 bg-white p-6 rounded shadow">
            <h3 class="text-xl font-bold mb-2">Appointments Overview</h3>
            <canvas id="appointmentsChart" class="h-80 w-full"></canvas>
          </div>
        </div>

        <div id="tab-services" class="tab-section hidden">
          <div class="mt-8 bg-white p-6 rounded shadow">
            <h3 class="text-xl font-bold mb-2">Services Overview</h3>
            <canvas id="servicesChart" class="h-80 w-full"></canvas>
          </div>
        </div>

        <div id="tab-staff" class="tab-section hidden">
          <div class="mt-8 bg-white p-6 rounded shadow">
            <h3 class="text-xl font-bold mb-2">Staff Performance</h3>
            <canvas id="staffChart" class="h-80 w-full"></canvas>
          </div>
        </div>
      </div>
    </main>
  </div>
    <script src="reports.js"></script>
  </body>
</html>
