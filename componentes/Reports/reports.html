<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reportes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="flex">

        <!-- Main Content -->
        <main class="flex-1 p-6">
            <div class="container mx-auto">
                <div class="flex flex-wrap items-center justify-between mb-8 gap-4">
                    <h1 class="text-3xl font-bold">Reports</h1>
                    <div class="flex items-center gap-2">
                        <select id="reportType" class="border rounded p-2 w-[180px]">
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                            <option value="monthly" selected>Monthly</option>
                            <option value="quarterly">Quarterly</option>
                            <option value="yearly">Yearly</option>
                        </select>
                        <input type="month" id="reportDate" class="border rounded p-2 w-[240px]">
                        <button id="printBtn" class="border rounded p-2">🖨️ Print</button>
                        <button id="exportBtn" class="border rounded p-2">⬇️ Export</button>
                    </div>
                </div>

                <!-- Stats Cards -->
                <div class="grid gap-6 md:grid-cols-4">
                    <div class="bg-white p-4 rounded shadow">
                        <h3>Total Revenue</h3>
                        <p id="revenueValue" class="text-2xl font-bold">$0</p>
                    </div>
                    <div class="bg-white p-4 rounded shadow">
                        <h3>Total Appointments</h3>
                        <p id="appsValue" class="text-2xl font-bold">0</p>
                    </div>
                    <div class="bg-white p-4 rounded shadow">
                        <h3>New Clients</h3>
                        <p id="clientsValue" class="text-2xl font-bold">0</p>
                    </div>
                    <div class="bg-white p-4 rounded shadow">
                        <h3>Cancellations</h3>
                        <p id="cancelsValue" class="text-2xl font-bold">0</p>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="mt-6">
                    <div class="flex gap-4 mb-4">
                        <button class="tabBtn px-4 py-2 border" data-tab="revenue">Revenue</button>
                        <button class="tabBtn px-4 py-2 border" data-tab="appointments">Appointments</button>
                        <button class="tabBtn px-4 py-2 border" data-tab="services">Services</button>
                        <button class="tabBtn px-4 py-2 border" data-tab="staff">Staff</button>
                    </div>

                    <!-- Tabs Content -->
                    <div id="revenue" class="tabContent space-y-4">
                        <canvas id="revenueChart" width="400" height="200"></canvas>
                    </div>
                    <div id="appointments" class="tabContent hidden space-y-4">
                        <canvas id="appointmentsChart" width="400" height="200"></canvas>
                    </div>
                    <div id="services" class="tabContent hidden space-y-4">
                        <canvas id="servicesChart" width="400" height="200"></canvas>
                    </div>
                    <div id="staff" class="tabContent hidden space-y-4">
                        <canvas id="staffChart" width="400" height="200"></canvas>
                    </div>

                    <!-- Recent Reports -->
                    <div class="mt-6">
                        <h2 class="text-xl font-semibold mb-4">Recent Reports</h2>
                        <div id="recentReports" class="space-y-3"></div>
                    </div>
                </div>
        </main>
    </div>
    <script src="reports.js"></script>
</body>

</html>
