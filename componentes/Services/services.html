
   <body>
    <main class="flex-1 p-6">
      <div class="container mx-auto">
        <div class="flex items-center justify-between mb-8">
          <h1 class="text-3xl font-bold">Services Management</h1>
          <button id="openDialog" class="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
            Add New Service
          </button>
        </div>

        <div class="mb-6">
          <div class="relative w-full max-w-md">
            <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-2 top-2.5 h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
            <input id="searchInput" type="text" placeholder="Search services..." class="pl-8 w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
        </div>

        <div class="bg-white rounded shadow">
          <div class="border-b p-4">
            <h2 class="text-xl font-semibold">Services List</h2>
          </div>
          <div class="overflow-x-auto">
            <table class="table-auto w-full">
              <thead class="bg-gray-100">
                <tr>
                  <th class="px-4 py-2 text-left">Service Name</th>
                  <th class="px-4 py-2 text-left">Description</th>
                  <th class="px-4 py-2 text-left">Duration</th>
                  <th class="px-4 py-2 text-left">Price</th>
                  <th class="px-4 py-2 text-left">Category</th>
                  <th class="px-4 py-2 text-left">Status</th>
                  <th class="px-4 py-2 text-left">Actions</th>
                </tr>
              </thead>
              <tbody id="servicesTableBody">
                <!-- Dynamic rows inserted by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Dialog Form -->
  <div id="dialog" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded shadow-lg w-full max-w-lg">
      <h2 class="text-xl font-bold mb-2">Add New Service</h2>
      <p class="text-sm text-gray-600 mb-4">Create a new service offering for the clinic.</p>
      <form id="serviceForm" class="space-y-4">
        <div>
          <label class="block font-medium">Service Name</label>
          <input name="name" required minlength="2" class="w-full border px-3 py-2 rounded" />
        </div>
        <div>
          <label class="block font-medium">Description</label>
          <textarea name="description" required minlength="10" class="w-full border px-3 py-2 rounded"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block font-medium">Duration (minutes)</label>
            <input name="duration" type="number" min="5" class="w-full border px-3 py-2 rounded" />
          </div>
          <div>
            <label class="block font-medium">Price ($)</label>
            <input name="price" type="number" min="1" class="w-full border px-3 py-2 rounded" />
          </div>
        </div>
        <div>
          <label class="block font-medium">Category</label>
          <input name="category" required minlength="2" placeholder="e.g. wellness" class="w-full border px-3 py-2 rounded" />
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" id="cancelDialog" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Add Service</button>
        </div>
      </form>
    </div>
  </div>
  <script src="services.js"></script>

   </body>
