<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Servicios</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.2s ease-out forwards;
    }
  </style>
</head>
<body onload="initComponent()" class="bg-gray-100 text-sm min-h-screen">
  <main class="flex-1 p-6">
    <div class="container mx-auto">
      <div class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-bold">Gestión de Servicios</h1>
        <button id="openDialog" class="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          Agregar Servicio
        </button>
      </div>

      <div class="mb-6">
        <div class="relative w-full max-w-md">
          <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-2 top-2.5 h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input id="searchInput" type="text" placeholder="Buscar servicios..." class="pl-8 w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>

      <div class="bg-white rounded shadow overflow-x-auto">
        <div class="border-b p-4">
          <h2 class="text-xl font-semibold">Lista de Servicios</h2>
        </div>
        <table class="table-auto w-full min-w-[800px] text-sm">
          <thead class="bg-gray-100">
            <tr>
              <th class="px-4 py-2 text-left">Nombre</th>
              <th class="px-4 py-2 text-left">Descripción</th>
              <th class="px-4 py-2 text-left">Duración</th>
              <th class="px-4 py-2 text-left">Precio</th>
              <th class="px-4 py-2 text-left">Categoría</th>
              <th class="px-4 py-2 text-left">Estado</th>
              <th class="px-4 py-2 text-left">Acciones</th>
            </tr>
          </thead>
          <tbody id="servicesTableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div id="dialog" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded shadow-lg w-full max-w-lg animate-fadeIn">
      <h2 class="text-xl font-bold mb-2" id="dialogTitle">Agregar Servicio</h2>
      <p class="text-sm text-gray-600 mb-4" id="dialogDescription">Completa los campos para registrar un nuevo servicio.</p>
      <form id="serviceForm" class="space-y-4">
        <input type="hidden" name="editId" id="editId" />
        <div>
          <label class="block font-medium">Nombre del Servicio</label>
          <input name="name" required minlength="2" class="w-full border px-3 py-2 rounded text-base" />
        </div>
        <div>
          <label class="block font-medium">Descripción</label>
          <textarea name="description" required minlength="10" class="w-full border px-3 py-2 rounded text-base"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block font-medium">Duración (minutos)</label>
            <input name="duration" type="number" min="5" class="w-full border px-3 py-2 rounded text-base" />
          </div>
          <div>
            <label class="block font-medium">Precio (S/)</label>
            <input name="price" type="number" min="1" class="w-full border px-3 py-2 rounded text-base" />
          </div>
        </div>
        <div>
          <label class="block font-medium">Categoría</label>
          <input name="category" required minlength="2" placeholder="Ej. bienestar" class="w-full border px-3 py-2 rounded text-base" />
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" id="cancelDialog" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Cancelar</button>
          <button type="submit" id="submitBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 flex items-center gap-2">
            <span>Guardar</span>
            <svg id="spinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
            </svg>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="services.js"></script>
</body>
</html>
