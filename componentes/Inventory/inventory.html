<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Sidebar -->
  <div class="flex min-h-screen">
    <!-- Main -->
    <main class="flex-1 p-6">
      <div class="container mx-auto">
        <div class="mb-8 flex items-center justify-between">
          <h1 class="text-3xl font-bold">Inventory Management</h1>
          <button onclick="toggleModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded flex items-center gap-2">
            ➕ Add New Item
          </button>
        </div>

        <!-- Filters -->
        <div class="mb-6 flex flex-wrap items-center gap-4">
          <select id="categoryFilter" class="p-2 border rounded">
            <option value="all">All Categories</option>
          </select>
          <select id="statusFilter" class="p-2 border rounded">
            <option value="all">All Statuses</option>
            <option value="in_stock">In Stock</option>
            <option value="low_stock">Low Stock</option>
            <option value="out_of_stock">Out of Stock</option>
          </select>
          <input type="text" id="searchInput" placeholder="Search inventory..." class="p-2 border rounded flex-1" />
        </div>

        <!-- Table -->
        <div class="overflow-auto bg-white shadow rounded">
          <table class="min-w-full text-sm text-left">
            <thead class="bg-gray-200">
              <tr>
                <th class="p-3">Item Name</th>
                <th class="p-3">Category</th>
                <th class="p-3">Quantity</th>
                <th class="p-3">Reorder Level</th>
                <th class="p-3">Expiry Date</th>
                <th class="p-3">Supplier</th>
                <th class="p-3">Status</th>
              </tr>
            </thead>
            <tbody id="inventoryTable"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
    <div class="bg-white w-96 p-6 rounded shadow-lg relative">
      <h2 class="text-xl font-bold mb-4">Add New Item</h2>
      <form id="addItemForm" class="space-y-4">
        <input type="text" id="name" placeholder="Item Name" class="w-full p-2 border rounded" required />
        <input type="text" id="category" placeholder="Category" class="w-full p-2 border rounded" required />
        <input type="number" id="quantity" placeholder="Quantity" class="w-full p-2 border rounded" required />
        <input type="text" id="unit" placeholder="Unit" class="w-full p-2 border rounded" required />
        <input type="number" id="reorderLevel" placeholder="Reorder Level" class="w-full p-2 border rounded" required />
        <input type="date" id="expiryDate" class="w-full p-2 border rounded" required />
        <input type="text" id="supplier" placeholder="Supplier" class="w-full p-2 border rounded" required />
        <div class="flex justify-end gap-2 mt-4">
          <button type="button" onclick="toggleModal()" class="px-4 py-2 border rounded">Cancel</button>
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Add</button>
        </div>
      </form>
    </div>
  </div>

<script src="inventory.js"></script>
</body>
</html>
